<style>
/* layout: a sticky top bar with tabs, a stage below; the proposal is a document with a contents rail, the prototype a phone or window frame */
:root{
  --bg:#F1EEE9; --surface:#FFFFFF; --surface-2:#F7F4F0; --fg:#1B1A19; --muted:#6B635D; --line:#DED7CF; --line-soft:#EAE4DD;
  --accent:#1F5B4B; --accent-fg:#FFFFFF; --accent-soft:#E2EFE9; --accent-ink:#1F5B4B; --hot:#C8503F;
  --warn:#8F6210; --warn-soft:#FBF0D9; --danger:#B23A3A; --danger-soft:#F9E5E5; --ok:#1F5B4B; --ok-soft:#E2EFE9; --info:#2F6FE0; --info-soft:#E7EFFC;
  --shadow:0 1px 2px rgba(27,26,25,.06),0 10px 28px -14px rgba(27,26,25,.25);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --display:Manrope,Inter,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141412; --surface:#1D1C1A; --surface-2:#252320; --fg:#ECE8E2; --muted:#A39B93; --line:#36332F; --line-soft:#2C2A27;
  --accent:#6FB79E; --accent-fg:#0F2C23; --accent-soft:#1E3A31; --accent-ink:#9FD3BE; --hot:#E8806F;
  --warn:#E0B35A; --warn-soft:#3A2E12; --danger:#F08A7E; --danger-soft:#3F1E1B; --ok:#6FB79E; --ok-soft:#1E3A31; --info:#8FB3F5; --info-soft:#1C2A45;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1D1C1A; --surface-2:#252320; --fg:#ECE8E2; --muted:#A39B93; --line:#36332F; --line-soft:#2C2A27;
  --accent:#6FB79E; --accent-fg:#0F2C23; --accent-soft:#1E3A31; --accent-ink:#9FD3BE; --hot:#E8806F;
  --warn:#E0B35A; --warn-soft:#3A2E12; --danger:#F08A7E; --danger-soft:#3F1E1B; --ok:#6FB79E; --ok-soft:#1E3A31; --info:#8FB3F5; --info-soft:#1C2A45;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25;font-family:var(--display)}
p{margin:0}
a{color:var(--accent-ink)}
svg.i{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* shell */
.shell{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;align-items:center;gap:10px;min-height:54px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-inline-end:6px}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;line-height:1.1}
.top-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top-tabs button{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;color:var(--fg);display:flex;align-items:center;gap:7px;transition:border-color .12s,color .12s,background .12s}
.top-tabs button:hover{border-color:var(--accent);color:var(--accent-ink)}
.top-tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.top-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hot-toggle{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface)}
.hot-toggle .sw{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:.15s}
.hot-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.hot-toggle[aria-pressed="true"]{color:var(--fg);border-color:var(--hot)}
.hot-toggle[aria-pressed="true"] .sw{background:var(--hot)}
.hot-toggle[aria-pressed="true"] .sw::after{left:14px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:var(--surface)}
.crumbs{display:flex;align-items:center;gap:8px;min-height:40px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted);flex-wrap:wrap;padding-block:5px}
.crumb{display:inline-flex;align-items:center;gap:8px;padding:5px 13px 5px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-soft)}
.crumb .gdot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.crumb .sep{color:var(--line);font-size:14px}
.crumb b{color:var(--fg);font-weight:600}
.stage{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.stage-inner{max-width:1280px;margin:0 auto}
.hint{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--hot);margin-bottom:14px;font-size:13px}
.hint b{color:var(--hot)}
.hint .x{margin-inline-start:auto;color:var(--muted)}
body.hot [data-go]{outline:2px dashed var(--hot);outline-offset:-2px}
body.hot [data-go]:hover{outline-style:solid}
[data-go]{cursor:pointer}

/* screen map */
.map-head{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:end;margin-bottom:22px}
.map-head h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.map-head p{color:var(--muted);max-width:62ch;margin-top:8px}
.map-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-family:var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.flowbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:22px}
.flowbox h2{font-size:15px;margin-bottom:10px}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flow .st{padding:7px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
.flow .st small{color:var(--muted)}
.flow .ar{color:var(--muted)}
.map-group{margin-bottom:26px}
.map-group h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.map-group h2 .dot{width:10px;height:10px;border-radius:3px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:start;transition:.12s;min-width:0}
.mcard:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.mcard .n{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.mcard .t{font-weight:600;font-size:14px}
.mcard .d{font-size:12.5px;color:var(--muted)}

/* phone + window frames */
.phone-wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.dev{width:414px;max-width:100%;background:#0b0d10;border-radius:46px;padding:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08) inset;flex:none;overflow:hidden}
.dev .phone{border-radius:34px;max-width:100%}
.side-notes{width:300px;max-width:100%;display:flex;flex-direction:column;gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.note h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:var(--sans)}
.jump{display:flex;flex-direction:column;gap:4px}
.jump button{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;text-align:start;font-weight:500}
.jump button:hover{background:var(--surface-2)}
.jump button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.win{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.winbar{height:38px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;flex:none}
.winbar .dots3{display:flex;gap:6px}
.winbar .dots3 i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.winbar .url{flex:1;max-width:460px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:7px;height:24px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;font-family:ui-monospace,Menlo,monospace}
.winbody{overflow-x:auto}
.winbody .web{min-width:900px}
.winbody .public{min-width:0}

/* proposal document */
.srs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.srs-toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - 140px);overflow:auto}
.toc-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 8px 8px}
.toc-i{text-align:start;padding:6px 8px;border-radius:7px;font-size:12.5px;color:var(--fg);line-height:1.3;display:block;text-decoration:none}
.toc-i:hover{background:var(--surface-2)}
.toc-i .tn{display:inline-block;min-width:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.srs-doc h3 .hn{color:var(--accent-ink);margin-inline-end:4px;font-variant-numeric:tabular-nums}
.srs-doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:40px 48px 56px;max-width:900px;font-size:14.5px;line-height:1.6;min-width:0}
.srs-doc h2,.srs-doc h3{scroll-margin-top:130px}
.srs-doc h2{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.srs-doc .meta{color:var(--muted);margin-bottom:22px}
.srs-doc .lead{font-size:17px;max-width:62ch;margin-bottom:8px}
.srs-doc h3{font-size:21px;font-weight:800;margin:40px 0 10px;padding-top:18px;border-top:1px solid var(--line-soft)}
.srs-doc p{margin:0 0 10px;max-width:72ch}
.srs-doc ul,.srs-doc ol{margin:0 0 12px;padding-inline-start:22px;max-width:72ch}
.srs-doc li{margin:3px 0}
.tbl-wrap{margin:10px 0 16px;border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:start;background:var(--surface-2);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.total td{font-weight:700;background:var(--surface-2)}
.pk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 6px}
.pk{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pk b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-family:var(--display);font-variant-numeric:tabular-nums}
.pk span{font-size:12.5px;color:var(--muted)}
.fig{margin:14px 0 20px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface-2)}
.fig figcaption{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
.plan-dg{display:flex;flex-direction:column;gap:6px;min-width:0;overflow-x:auto}
.wk-head,.wk-row{display:grid;grid-template-columns:minmax(190px,1.3fr) repeat(13,minmax(30px,1fr));gap:4px;align-items:stretch;min-width:640px}
.wk-head span{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
.wk-t{font-size:12.5px;padding:6px 8px 6px 0}
.wk-t b{display:block}
.wk-t small{display:block;color:var(--muted);font-size:11px;line-height:1.35}
.wk-c{border-radius:6px;background:var(--surface);border:1px solid var(--line-soft);min-height:32px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff}
.wk-c.d{background:var(--accent);border-color:var(--accent)}
.wk-c.b{background:var(--info);border-color:var(--info)}
.wk-c.g{background:var(--hot);border-color:var(--hot)}
.wk-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.wk-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:5px}
.wk-legend i.d{background:var(--accent)}.wk-legend i.b{background:var(--info)}.wk-legend i.g{background:var(--hot)}
.proto-link{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;text-decoration:none}

@media (max-width:1000px){ .srs{grid-template-columns:1fr} .srs-toc{position:static;max-height:none} .srs-doc{padding:24px 18px 36px} .map-head{grid-template-columns:1fr} .map-stats{justify-content:flex-start} .pk-grid{grid-template-columns:1fr} }
@media (max-width:600px){ .brand small{display:none} .top-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;order:3;flex:1 1 100%} .top-tabs button{padding:6px 11px;font-size:12.5px;white-space:nowrap} .hot-toggle span:not(.sw){display:none} .hint{display:none} .stage{padding-block:10px 24px} .dev{padding:0;background:transparent;box-shadow:none;border-radius:0} .dev .phone{border-radius:20px;border:1px solid var(--line)} }

/* prototype screens (the product's own look, always light) */
.proto{--ink:#1B1A19;--muted:#6B635D;--line:#E9E3DD;--bg:#FAF8F5;--card:#FFFFFF;--brand:#1F5B4B;--brand-deep:#153F34;--brand-soft:#E2EFE9;--blush:#F6E8E2;--blush-deep:#8A4B3C;--amber:#8F6210;--amber-soft:#FBF0D9;--red:#B23A3A;--red-soft:#F9E5E5;--star:#C9931F;color-scheme:light}
.proto a{color:inherit;text-decoration:none}

<article class="srs-doc">
<h2>Beauty Services Marketplace</h2>
<div class="meta">Proposal for design and development · 26 November 2026 · valid 30 days</div>
<p class="lead">Design and build the marketplace in three months for USD 20,000, fixed price. Launch in week 12.</p>

<h3 id="p-glance"><span class="hn">1.</span> At a glance</h3>
<div class="pk-grid"><div class="pk"><b>USD 20,000</b><span>total, fixed price</span></div><div class="pk"><b>12 weeks</b><span>to launch, plus 2 weeks of support</span></div><div class="pk"><b>4 surfaces</b><span>customer app, professional mode, admin console, public page</span></div></div>
<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Design</th><th>Development</th></tr></thead><tbody>
<tr><td>Weeks</td><td>1 to 6</td><td>3 to 13</td></tr>
<tr><td>Delivers</td><td>Flows, wireframes, design system, every screen with its states, clickable prototype, usability test, handoff</td><td>iOS and Android app in customer and professional modes, backend and integrations, admin console, public profile page, store release, 2 weeks of launch support</td></tr>
</tbody></table></div>


<h3 id="p-product"><span class="hn">2.</span> What we are building</h3>
<p>A mobile app where customers in South Africa find a vetted beauty, cleaning or tattoo professional nearby, compare and book. The same app in professional mode runs the professional's services, availability and bookings. A web console for vetting, payments, moderation and disputes. A public profile page per professional.</p>
<ul>
<li>Radius search with list and map; mobile, studio, or both.</li>
<li>Two booking modes per professional: instant or request.</li>
<li>Vetting before the first booking, shown on the profile.</li>
<li>Public reviews of professionals; private reliability notes on clients.</li>
<li>Card payments, cash for approved professionals, payouts from the console.</li>
<li>Country, currency and categories as configuration, ready for the next market.</li>
</ul>

<h3 id="p-design"><span class="hn">3.</span> Design scope</h3>
<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Workstream</th><th>You receive</th><th>Weeks</th></tr></thead><tbody>
<tr><td>1</td><td>UX research and IA</td><td>6 interviews, personas, sitemap, navigation for both modes</td><td>1</td></tr>
<tr><td>2</td><td>Flows and wireframes</td><td>All flows, about 60 annotated wireframes</td><td>1 to 2</td></tr>
<tr><td>3</td><td>UI design and design system</td><td>Figma design system, tokens, components with states</td><td>2 to 3</td></tr>
<tr><td>4</td><td>Responsive layouts</td><td>All screens for app, console and public page, with loading, empty and error states</td><td>3 to 5</td></tr>
<tr><td>5</td><td>Prototype and usability test</td><td>Figma prototype, 1 round of 5 sessions, findings fixed</td><td>5</td></tr>
<tr><td>6</td><td>Handoff and specs</td><td>Redlines, component specs, copy deck, acceptance criteria</td><td>5 to 6</td></tr>
</tbody></table></div>
<p>One revision round per workstream, with your sign-off at the end of each.</p>

<h3 id="p-dev"><span class="hn">4.</span> Development scope</h3>
<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Track</th><th>What is built</th><th>Weeks</th></tr></thead><tbody>
<tr><td>App, customer mode</td><td>Sign-in, search and map, profiles, booking in both modes, card and cash payment, status and reminders, messaging, reschedule and cancel, reviews</td><td>3 to 11</td></tr>
<tr><td>App, professional mode</td><td>Apply and verify, services and prices, availability and radius, requests, schedule, earnings, client reliability notes, salon profile</td><td>4 to 11</td></tr>
<tr><td>Backend and integrations</td><td>API, geo search, booking engine, payments and payouts, identity verification, maps, push and SMS, messaging, audit log</td><td>3 to 11</td></tr>
<tr><td>Admin console</td><td>Vetting, professionals, customers, bookings, payments, disputes, moderation, catalogue, settings, roles</td><td>5 to 11</td></tr>
<tr><td>Public profile page</td><td>Shareable, indexed page per professional with a Book button</td><td>9 to 10</td></tr>
<tr><td>Testing and launch</td><td>Automated and device tests, acceptance round, security review, store submission, 2 weeks of launch support</td><td>10 to 13</td></tr>
</tbody></table></div>
<p>One Flutter codebase for iOS and Android. Default providers: Paystack or Peach Payments, Smile ID, Google Maps, Firebase.</p>

<h3 id="p-cost"><span class="hn">5.</span> Cost</h3>
<p><strong>USD 20,000</strong>, fixed price, for everything in the design and development scope above.</p>
<p>Not included, paid by you: store accounts, payment gateway fees, identity checks, maps usage, hosting, SMS.</p>

<p>Three sign-offs: wireframes (week 2), design (week 6), beta (week 10). A late sign-off moves everything after it.</p>

<p>USD, bank transfer, 14 days. Valid 30 days from the date above.</p>

<h3 id="p-terms"><span class="hn">8.</span> Ownership, assumptions, not included</h3>
<p><strong>Ownership</strong></p>
<ul>
<li>On final payment you own the design files, design system, prototype, source code and assets.</li>
<li>Fonts, images and libraries stay under their own licences, all free for commercial use.</li>
</ul>
<p><strong>Assumptions</strong></p>
<ul>
<li>The blueprint matches about 60 screens on four surfaces; if larger, we re-estimate before signing.</li>
<li>South Africa, rand and English at launch.</li>
<li>You provide the brand: name, logo and colours.</li>
<li>You own the store, payment, verification, maps and cloud accounts.</li>
<li>Feedback within 2 working days; one decision maker.</li>
<li>You supply categories, pricing rules, policies and terms.</li>
<li>iOS 16+ and Android 10+, phones only.</li>
</ul>
<p><strong>Not included</strong></p>
<ul>
<li>Marketing website, salon team tools, tablet layouts, offline mode, AI features.</li>
<li>Legal review of terms and payments compliance.</li>
<li>Hosting operations after launch support.</li>
<li>Data migration.</li>
</ul>

<h3 id="p-next"><span class="hn">9.</span> Next steps</h3>
<ol>
<li>Confirm interest, sign the NDA.</li>
<li>We read the blueprint and send questions within 3 working days.</li>
<li>Question call, with a prototype walkthrough.</li>
<li>Final proposal within 5 working days.</li>
<li>Signing and kick-off.</li>
</ol>

<h3 id="p-proto"><span class="hn">10.</span> Prototype</h3>
<p>Every surface is in this page, clickable: <button class="proto-link" data-view="map">Open the screens</button></p>
<ul>
<li>Customer app: explore, results, profile, book, pay, booking status, messages.</li>
<li>Professional mode: today, requests, services and hours, verification.</li>
<li>Admin console: vetting queue, bookings and disputes.</li>
<li>Public profile page.</li>
</ul>
<p>Name, colours, photos and copy are placeholders. The flows and the structure are the proposal.</p>

  </main>

  <footer style="background:#fff;border-top:1px solid #E9E3DD">
    <div style="max-width:1080px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between" class="small muted">
      <span>© 2026 Luma · Vetted beauty professionals near you · South Africa</span>
      <div class="row" style="gap:8px"><a href="#" data-go="Main" class="btn sm ghost">App Store</a><a href="#" data-go="Main" class="btn sm ghost">Google Play</a></div>
    </div>
  </footer>
</div></template>

<script>
const SCREENS = [{"key":"Main","group":"customer","title":"Explore","desc":"Search by service and radius, map of professionals near you, next appointment, book again."},{"key":"Search","group":"customer","title":"Results","desc":"List and map, filters for distance, mobile or studio, price. Instant-book and request badges."},{"key":"Profile","group":"customer","title":"Professional profile","desc":"Portfolio, verification panel, services with prices, availability, reviews."},{"key":"Book","group":"customer","title":"Book","desc":"Comes to you or studio, day and time, add-ons, live price bar."},{"key":"Pay","group":"customer","title":"Pay and confirm","desc":"Saved card, new card, or cash for approved professionals. Cancellation policy."},{"key":"Booking","group":"customer","title":"Booking status","desc":"Status steps, reminders, reschedule, cancel sheet, request awaiting reply, rate a visit."},{"key":"Chat","group":"customer","title":"Messages","desc":"Thread with the professional, booking context, quick replies, photos."},{"key":"ProHome","group":"pro","title":"Today","desc":"Taking-bookings switch, today’s jobs, earnings, rating, on my way."},{"key":"ProRequests","group":"pro","title":"Requests and bookings","desc":"Accept or decline a request, private client reliability, upcoming."},{"key":"ProServices","group":"pro","title":"Services and availability","desc":"Instant or request mode, travel radius and fee, services and prices, hours, portfolio."},{"key":"ProVerify","group":"pro","title":"Apply and get verified","desc":"ID, selfie match, qualifications, address. Nothing is bookable before approval."},{"key":"AdminVetting","group":"admin","title":"Vetting queue","desc":"Applications, automatic checks, document review, approve, request more info, reject."},{"key":"AdminBookings","group":"admin","title":"Bookings and disputes","desc":"Today’s bookings, payouts due, a dispute with its evidence and decision."},{"key":"PublicProfile","group":"web","title":"Public profile page","desc":"Shareable, search-indexed page per professional that books into the app."}];
const GROUPS = {"customer":["Customer app","#1F5B4B"],"pro":["Professional mode","#8A4B3C"],"admin":["Admin console","#2F6FE0"],"web":["Public profile page","#8F6210"]};
const TABS = [['map','Screens'],['customer','Customer app'],['pro','Professional mode'],['admin','Admin console'],['web','Public page'],['proposal','Proposal']];
const FIRST = { customer:'Main', pro:'ProHome', admin:'AdminVetting', web:'PublicProfile' };
const FLOWS = [
  ['Find, book and pay', [['Main','Explore'],['Search','Results'],['Profile','Profile'],['Book','Book'],['Pay','Pay'],['Booking','Status'],['Chat','Messages']]],
  ['Become a professional', [['ProVerify','Apply and verify'],['ProServices','Services and hours'],['ProHome','Today'],['ProRequests','Requests']]],
  ['Vet and run the platform', [['AdminVetting','Vetting queue'],['AdminBookings','Bookings and disputes'],['PublicProfile','Public page']]],
];
const byKey = Object.fromEntries(SCREENS.map(s => [s.key, s]));
const state = { view: 'map', screen: null, hot: false, history: [] };
const $ = s => document.querySelector(s);
const tpl = id => id === 'proposal' ? $('#t-proposal').innerHTML : '<div class="proto">' + $('#t-' + id).innerHTML + '</div>';

function route(h){
  h = (h || '').replace(/^#/, '');
  if (!h || h === 'map') return { view: 'map', screen: null };
  if (h === 'proposal') return { view: 'proposal', screen: null };
  const s = SCREENS.find(x => x.key.toLowerCase() === h.toLowerCase());
  if (s) return { view: s.group, screen: s.key };
  return { view: 'map', screen: null };
}
function go(key){
  const s = byKey[key];
  if (!s) return;
  state.history.push(location.hash);
  location.hash = s.key.toLowerCase();
}
function setView(v){
  state.history.push(location.hash);
  location.hash = v === 'map' ? 'map' : v === 'proposal' ? 'proposal' : FIRST[v].toLowerCase();
}

function renderTabs(){
  $('#tabs').innerHTML = TABS.map(t => '<button role="tab" aria-selected="' + (state.view === t[0]) + '" data-view="' + t[0] + '">' + t[1] + '</button>').join('');
}
function renderCrumb(){
  const s = state.screen && byKey[state.screen];
  $('#crumb').innerHTML = '<span class="crumb"><span class="gdot" style="background:' + (s ? GROUPS[s.group][1] : 'var(--accent)') + '"></span>' + (s ? GROUPS[s.group][0] + '<span class="sep">›</span><b>' + s.title + '</b>' : state.view === 'proposal' ? '<b>Proposal</b>' : '<b>All screens</b>') + '</span>';
}
function renderMap(){
  return '<div class="map-head"><div><h1>Every screen, clickable</h1><p>A working prototype of the marketplace as we read the brief: the customer app, the professional mode, the admin console and the public profile page. Open any card and tap through. Turn on <b>Show clickable</b> to outline what can be tapped. The proposal with scope, cost and plan is under the <b>Proposal</b> tab.</p></div>'
    + '<div class="map-stats"><div class="stat"><b>' + SCREENS.length + '</b><span>screens</span></div><div class="stat"><b>4</b><span>surfaces</span></div><div class="stat"><b>3 months</b><span>to launch</span></div></div></div>'
    + FLOWS.map(f => '<div class="flowbox"><h2>' + f[0] + '</h2><div class="flow">' + f[1].map((s, i) => (i ? '<span class="ar">→</span>' : '') + '<button class="st" data-go="' + s[0] + '"><small>' + (i + 1) + '</small>' + s[1] + '</button>').join('') + '</div></div>').join('')
    + Object.keys(GROUPS).map(g => { const list = SCREENS.filter(s => s.group === g); return '<section class="map-group"><h2><span class="dot" style="background:' + GROUPS[g][1] + '"></span>' + GROUPS[g][0] + ' <span style="color:var(--muted);font-weight:500">· ' + list.length + (list.length === 1 ? ' screen' : ' screens') + '</span></h2><div class="map-grid">' + list.map((s, i) => '<button class="mcard" data-go="' + s.key + '"><span class="n">' + String(i + 1).padStart(2, '0') + '</span><span class="t">' + s.title + '</span><span class="d">' + s.desc + '</span></button>').join('') + '</div></section>'; }).join('');
}
function renderPhone(s){
  const list = SCREENS.filter(x => x.group === s.group);
  return '<div class="phone-wrap"><div class="dev">' + tpl(s.key) + '</div>'
    + '<aside class="side-notes"><div class="note"><h4>This screen</h4><div style="font-weight:600;margin-bottom:4px">' + s.title + '</div><div style="color:var(--muted)">' + s.desc + '</div></div>'
    + '<div class="note"><h4>' + GROUPS[s.group][0] + '</h4><div class="jump">' + list.map(x => '<button data-go="' + x.key + '" aria-current="' + (x.key === s.key) + '">' + x.title + '</button>').join('') + '</div></div></aside></div>';
}
function renderWin(s){
  const url = s.group === 'admin' ? 'admin.luma.co.za/' + s.key.replace('Admin', '').toLowerCase() : 'luma.co.za/naledi';
  const list = SCREENS.filter(x => x.group === s.group);
  return '<div class="note" style="margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><div><div style="font-weight:600">' + s.title + '</div><div style="color:var(--muted)">' + s.desc + '</div></div><div class="jump" style="flex-direction:row;margin-inline-start:auto">' + list.map(x => '<button data-go="' + x.key + '" aria-current="' + (x.key === s.key) + '">' + x.title + '</button>').join('') + '</div></div>'
    + '<div class="win"><div class="winbar"><span class="dots3"><i></i><i></i><i></i></span><span class="url">' + url + '</span></div><div class="winbody">' + tpl(s.key).replace('<div style="min-height:100%;background:#FAF8F5', '<div class="public" style="min-height:100%;background:#FAF8F5') + '</div></div>';
}
function render(){
  renderTabs(); renderCrumb();
  const st = $('#stage');
  const s = state.screen && byKey[state.screen];
  if (state.view === 'map') st.innerHTML = renderMap();
  else if (state.view === 'proposal') st.innerHTML = tpl('proposal');
  else if (!s) st.innerHTML = renderMap();
  else st.innerHTML = (s.group === 'customer' || s.group === 'pro') ? renderPhone(s) : renderWin(s);
  document.body.classList.toggle('hot', state.hot);
  window.scrollTo({ top: 0 });
}
function apply(){ Object.assign(state, route(location.hash)); render(); }
window.addEventListener('hashchange', apply);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-view],[data-sheet],[data-jump],a[href="#"]');
  if (!t) return;
  if (t.dataset.jump) { e.preventDefault(); const el = document.getElementById(t.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.matches('a[href="#"]') && !t.dataset.go) { e.preventDefault(); return; }
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
  if (t.dataset.view) { setView(t.dataset.view); return; }
  if (t.dataset.sheet) { const sh = t.closest('.proto').querySelector('.csheet'); if (sh) sh.hidden = t.dataset.sheet !== 'open'; }
});
$('#hot').addEventListener('click', () => { state.hot = !state.hot; $('#hot').setAttribute('aria-pressed', state.hot); document.body.classList.toggle('hot', state.hot); });
$('#theme').addEventListener('click', () => { const r = document.documentElement; const dark = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); r.setAttribute('data-theme', dark ? 'light' : 'dark'); });
apply();
</script>
</body>
</html>
